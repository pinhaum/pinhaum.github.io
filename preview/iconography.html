<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--gcr-night); padding: 20px; }
  .icons { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: var(--bg-elevated);
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000;
    padding: 14px 8px 10px;
  }
  .cell img {
    width: 56px; height: 56px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
  }
  .cap {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--fg-2);
    letter-spacing: 0.06em;
  }
</style>
</head><body>
<div class="card">
  <div class="label">Iconografia · pixel-art SVGs · 16×16 grid, redesenhados</div>
  <div class="icons">
    <div class="cell"><img src="../assets/img/ico_html5.svg" alt="html5"><span class="cap">HTML</span></div>
    <div class="cell"><img src="../assets/img/ico_css3.svg" alt="css"><span class="cap">CSS</span></div>
    <div class="cell"><img src="../assets/img/ico_js.svg" alt="js"><span class="cap">JS</span></div>
    <div class="cell"><img src="../assets/img/ico_nodejs.svg" alt="node"><span class="cap">NODE</span></div>
    <div class="cell"><img src="../assets/img/ico_react.svg" alt="react"><span class="cap">REACT</span></div>
    <div class="cell"><img src="../assets/img/ico_restapi.svg" alt="rest"><span class="cap">REST</span></div>
    <div class="cell"><img src="../assets/img/ico_ruby.svg" alt="ruby"><span class="cap">RUBY</span></div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #0d0c25; padding: 20px; }
  .row3 {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 16px 28px;
    align-items: center;
  }
  .lbl { font-family: 'Press Start 2P', monospace; font-size: 12px; color: #f5ead0; }
  progress.bar {
    appearance: none;
    -webkit-appearance: none;
    background: #07061a;
    border: 4px solid #000;
    height: 24px;
    width: 100%;
    box-sizing: border-box;
  }
  progress.bar::-webkit-progress-bar { background: #07061a; }
  progress.bar.aurora::-webkit-progress-value { background: #5beaff; }
  progress.bar.aurora::-moz-progress-bar { background: #5beaff; }
  progress.bar.coral::-webkit-progress-value { background: #ff5577; }
  progress.bar.coral::-moz-progress-bar { background: #ff5577; }
  progress.bar.moon::-webkit-progress-value { background: #ffd166; }
  progress.bar.moon::-moz-progress-bar { background: #ffd166; }
  progress.bar.spark::-webkit-progress-value { background: #7cff9a; }
  progress.bar.spark::-moz-progress-bar { background: #7cff9a; }
</style>
</head><body>
<div class="card">
  <div class="label">Progress bar · 4 cores · fill neon sobre void</div>
  <div class="row3">
    <div class="lbl">HTML</div><progress class="bar aurora" max="100" value="90">90%</progress>
    <div class="lbl">JS</div>  <progress class="bar coral"  max="100" value="60">60%</progress>
    <div class="lbl">REACT</div><progress class="bar moon" max="100" value="60">60%</progress>
    <div class="lbl">RUBY</div> <progress class="bar spark" max="100" value="70">70%</progress>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #0d0c25; padding: 20px; }
  .demo { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: end; }
  .tile {
    background: #1a1742;
    height: 90px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px;
    color: #d9cfb3;
    font-family: 'Fira Code', monospace;
    font-size: 11px;
  }
  .sh1 { box-shadow: 2px 2px 0 #000; }
  .sh2 { box-shadow: 5px 5px 0 #000; }
  .sh3 { box-shadow: 9px 9px 0 #000; }
  .b1  { border: 4px solid #000; }
  .b2  { border: 4px solid #5beaff; }
  .b3  { border: 4px solid #ff5577; }
</style>
</head><body>
<div class="card">
  <div class="label">Bordas & shadows · offsets duros, sem blur, jamais arredondados</div>
  <div class="demo">
    <div class="tile sh1">SHADOW · 2px</div>
    <div class="tile sh2">SHADOW · 5px</div>
    <div class="tile sh3">SHADOW · 9px (hover)</div>
  </div>
  <div class="demo" style="margin-top:18px">
    <div class="tile b1">BORDER 4px · INK</div>
    <div class="tile b2">BORDER 4px · AURORA</div>
    <div class="tile b3">BORDER 4px · CORAL</div>
  </div>
</div>
</body></html>

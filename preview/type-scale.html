<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #0d0c25; padding: 20px; }
  .stack > * + * { margin-top: 16px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .lab { font-family: 'Fira Code', monospace; font-size: 10px; color: #8b8474; min-width: 60px; }
  .s1 { font-family: 'Press Start 2P', monospace; font-size: 32px; color: #f5ead0; text-shadow: 3px 3px 0 #000; }
  .s2 { font-family: 'Press Start 2P', monospace; font-size: 22px; color: #ffd166; text-shadow: 3px 3px 0 #000; }
  .s3 { font-family: 'Press Start 2P', monospace; font-size: 16px; color: #5beaff; }
  .s4 { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #b794ff; letter-spacing: 0.08em; }
</style>
</head><body>
<div class="card">
  <div class="label">Escala display · h1 / h2 (moon) / h3 (aurora) / kicker (nebula)</div>
  <div class="stack">
    <div class="row"><span class="lab">32px</span><span class="s1">Software Developer</span></div>
    <div class="row"><span class="lab">22px</span><span class="s2">// Projetos em destaque</span></div>
    <div class="row"><span class="lab">16px</span><span class="s3">Sobre · Diário · Contato</span></div>
    <div class="row"><span class="lab">11px</span><span class="s4">DEV · APRENDIZADO · 2026</span></div>
  </div>
</div>
</body></html>
